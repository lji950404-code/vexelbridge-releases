<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>VexelBridge 내려받기</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #141317; color: #f4f3f6; font-family: 'Pretendard', 'Malgun Gothic', system-ui, sans-serif; }
  main { display: flex; flex-direction: column; align-items: flex-start; gap: 16px; padding: 24px; max-width: 520px; }
  h1 { margin: 0; font-size: 40px; font-weight: 800; letter-spacing: -0.04em; }
  p { margin: 0; color: #b9b7bf; font-size: 15px; line-height: 1.7; }
  .meta { font-family: ui-monospace, 'Cascadia Mono', monospace; font-size: 13px; color: #8f8d96; }
  a.get { display: inline-flex; align-items: center; min-height: 52px; padding: 0 26px; border-radius: 999px; background: #f4f3f6; color: #141317; font-weight: 700; text-decoration: none; }
</style>
</head>
<body>
<main>
  <h1>VexelBridge</h1>
  <p>Windows 10 · 11 (64비트) · 사내 시험판</p>
  <a class="get" href="https://github.com/lji950404-code/vexelbridge-releases/releases/latest/download/VexelBridge-setup.exe">설치 파일 받기</a>
  <p class="meta" id="version"></p>
  <p>처음 실행할 때 'Windows의 PC 보호' 창이 뜨면 추가 정보 → 실행을 누르세요. 설치한 뒤에는 새 버전이 나오면 앱이 알아서 업데이트합니다.</p>
</main>
<script>
  // the latest version's number and date, from the releases of this repository
  fetch('https://api.github.com/repos/lji950404-code/vexelbridge-releases/releases/latest')
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (r) {
      if (!r || !r.tag_name) return;
      var date = (r.published_at || '').slice(0, 10);
      document.getElementById('version').textContent = '최신 ' + r.tag_name.replace(/^v/, '') + (date ? ' · ' + date : '');
    })
    .catch(function () {});
</script>
</body>
</html>
